name: Semgrep Security Scan

on:
  push:
    branches: ["main", "master"]
  pull_request:

# Grant permissions for OIDC token generation and pushing to GHCR
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sast_scan_semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep and Generate JSON
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep ci --json --output=semgrep.json --config auto || true

      - name: Beautify JSON output
        run: |
          cat semgrep.json | jq . > semgrep_beautified.json

      - name: Upload Beautified Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep_beautified.json

      - name: Save Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json
          path: semgrep.json

  sca_scan_trivy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy-sca.json'

      - name: Save Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json
          path: trivy-sca.json

  image_scan_scout:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and tag
        id: meta
        run: echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/juice-shop:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and push Juice Shop image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE_TAG }}
          push: true # Push the image to the registry

      - name: Scan image with Docker Scout (JSON)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_TAG }} # Scan the pushed image

      # --- COSIGN STEPS ---
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the container image with Cosign
        run: |
          cosign sign --yes ${{ env.IMAGE_TAG }}
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Verify container image signature
        run: |
          cosign verify ${{ env.IMAGE_TAG }}
        env:
          COSIGN_EXPERIMENTAL: 1

  upload_reports:
    runs-on: ubuntu-latest
    needs: [sast_scan_semgrep] # Add other jobs here if you want to upload their reports
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Retrieve Semgrep Scan Results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-json

      # You can add download steps for other artifacts (e.g., trivy-json) here

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Upload to DefectDojo
        env:
          DOJO_HOST: "demo.defectdojo.org"
          DOJO_USER: ${{ secrets.DOJO_USERNAME }}
          DOJO_PASS: ${{ secrets.DOJO_PASSWORD }}
        run: |
          # 1. Fetch the API Token dynamically
          API_KEY=$(curl -s -X POST -H 'Content-Type: application/json' \
          "https://$DOJO_HOST/api/v2/api-token-auth/" \
          -d "{\"username\": \"$DOJO_USER\", \"password\": \"$DOJO_PASS\"}" | jq -r '.token')
          
          # 2. Run the Python script to upload results
          # Note: Ensure 'upload-results.py' is in your repo root
          python3 upload-results.py \
          