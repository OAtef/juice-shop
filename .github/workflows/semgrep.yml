name: Semgrep Security Scan

on:
  push:
    branches: ["main", "master"]
  pull_request:

# Grant permissions for OIDC token generation and pushing to GHCR
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sast_scan_semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep and Generate JSON
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep ci --json --output=semgrep.json --config auto || true

      - name: Beautify JSON output
        run: |
          cat semgrep.json | jq . > semgrep_beautified.json

      - name: Upload Beautified Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep_beautified.json

      - name: Save Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json
          path: semgrep.json

  sca_scan_trivy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy-sca.json'

      - name: Save Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json
          path: trivy-sca.json

  image_scan_scout:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and tag
        id: meta
        run: |
          OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/${OWNER_LOWERCASE}/juice-shop:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and push Juice Shop image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE_TAG }}
          push: true # Push the image to the registry

      - name: Scan image with Docker Scout (JSON)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_TAG }} # Scan the pushed image

      # --- COSIGN STEPS ---
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the container image with Cosign
        run: |
          cosign sign --yes ${{ env.IMAGE_TAG }}
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Verify container image signature
        run: |
          cosign verify ${{ env.IMAGE_TAG }}
        env:
          COSIGN_EXPERIMENTAL: 1

  upload_reports:
    runs-on: ubuntu-latest
    needs: [sast_scan_semgrep] # Add other jobs here if you want to upload their reports
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Retrieve Semgrep Scan Results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-json

      # You can add download steps for other artifacts (e.g., trivy-json) here

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Upload to DefectDojo
        env:
          DOJO_HOST: "demo.defectdojo.org"
          DOJO_USER: ${{ secrets.DOJO_USERNAME }}
          DOJO_PASS: ${{ secrets.DOJO_PASSWORD }}
        run: |
          # 1. Fetch the API Token dynamically
          API_KEY=$(curl -s -X POST -H 'Content-Type: application/json' \
          "https://$DOJO_HOST/api/v2/api-token-auth/" \
          -d "{\"username\": \"$DOJO_USER\", \"password\": \"$DOJO_PASS\"}" | jq -r '.token')
          
          # 2. Run the Python script to upload results
          # Note: Ensure 'upload-results.py' is in your repo root
          python3 upload-results.py \

  secrets_scan_trivy:
    name: Trivy Secrets Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy for secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          # Exit with non-zero code if secrets are found
          exit-code: '1'
          # Tell Trivy to only look for secrets
          scanners: 'secret'
          # Ignore files that commonly contain false positives
          ignore-unfixed: true
          trivy-config: trivy-secrets.yaml

      # Create a dummy config file to ignore specific files if needed
      - name: Create Trivy secrets config
        if: always() # Run this even if the scan fails, to show the config
        run: |
          cat <<EOF > trivy-secrets.yaml
          secret:
            # You can add file paths to ignore here if you have false positives
            # For example:
            # skip-files:
            #   - "path/to/your/example-secrets.md"
          EOF


  dast_baseline_scan:
    name: DAST Baseline Scan
    runs-on: ubuntu-latest
    # This is the GitHub Actions equivalent of allow_failure: true
    continue-on-error: true
    # This job can run after the secrets scan passes
    needs: secrets_scan_trivy
    steps:
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          # The target URL to be scanned
          target: 'https://preview.owasp-juice.shop'
          # The name of the report file to be generated
          report_name: 'zap-baseline-report.html'
          # We use a Docker-based scan
          docker_name: 'owasp/zap2docker-stable'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-baseline-report.html