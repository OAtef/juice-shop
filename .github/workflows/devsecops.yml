name: "DevSecOps Security Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight

jobs:
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so TruffleHog can scan past commits

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified --json
        continue-on-error: true # Do not block pipeline during initial cleanup phase

  sca-scan:
    name: Software Composition Analysis (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json

  sast-scan:
    name: Static Application Security Testing (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep Rulesets
        run: |
          semgrep scan --config auto --json --output semgrep-results.json
        continue-on-error: true

      - name: Upload Semgrep Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.json

  vulnerability-management:
    name: Centralized DefectDojo Aggregation
    runs-on: ubuntu-latest
    needs: [sca-scan, sast-scan] # Wait for scanners to finish and produce reports
    steps:
      - name: Download Trivy Artifact
        uses: actions/download-artifact@v4
        with:
          name: trivy-report

      - name: Download Semgrep Artifact
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report

      - name: Import Trivy SCA Results to DefectDojo
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
          -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
          -F "active=true" \
          -F "verified=true" \
          -F "scan_type=Trivy Scan" \
          -F "minimum_severity=High" \
          -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
          -F "file=@trivy-results.json"

      - name: Import Semgrep SAST Results to DefectDojo
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
          -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
          -F "active=true" \
          -F "verified=true" \
          -F "scan_type=Semgrep JSON Report" \
          -F "minimum_severity=Info" \
          -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
          -F "file=@semgrep-results.json"